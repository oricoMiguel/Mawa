  <script>
    function selecionarData(botao) {
      // Remove destaque de todos os botões
      const botoes = document.querySelectorAll('.botoes button');
      botoes.forEach(btn => btn.style.background = '');
  
      // Destaca o botão clicado
      botao.style.background = 'lightgreen';
  
      // Mostra a data escolhida
      document.getElementById('dataSelecionada').textContent = "Data selecionada: " + botao.textContent;
    }

    function selecionarPeriodo(botao) {
    // Remove destaque de todos os botões
    const botoes = document.querySelectorAll('.periodos .botoes button');
    botoes.forEach(btn => btn.style.background = '');

    // Destaca o botão clicado
    botao.style.background = 'lightblue';

    // Mostra o período escolhido
    document.getElementById('periodoSelecionado').textContent = "Período selecionado: " + botao.textContent;
  }

   // 1. Obter referências aos elementos HTML
        const botao = document.getElementById('botaoMarcar');
        const inputCodigo = document.getElementById('campoCodigo');

        // 2. Adicionar um ouvinte de evento de clique ao botão
        botao.addEventListener('click', function() {
            // 3. Pegar o valor atual do campo de input
            const valorDoCodigo = inputCodigo.value;

            // 4. Verificar se o campo não está vazio
            if (valorDoCodigo.trim() !== '') { // .trim() remove espaços em branco extras
                alert('Você marcou o código: ' + valorDoCodigo);
                // Aqui você pode adicionar lógica para enviar o código para um servidor, etc.
            } else {
                alert('Por favor, digite um código antes de marcar.');
            }
        });

       // 1. Obter referências aos elementos HTML usando seus IDs
       const botaoMarcar = document.getElementById('botaoMarcar');
        const campoCodigo = document.getElementById('campoCodigo');

        // 2. Adicionar um "ouvinte de evento" (event listener) ao botão
        // Isso significa que o JavaScript "escutará" o evento de 'click' no botão
        botaoMarcar.addEventListener('click', function() {
            // Esta função será executada toda vez que o botão for clicado

            // Pegar o valor atual do campo de input
            const valorDigitado = campoCodigo.value;

            // Verificar se o campo não está vazio (removendo espaços em branco extras)
            if (valorDigitado.trim() !== '') {
                alert('Código marcado: ' + valorDigitado);
                // Aqui você pode adicionar a lógica real para "marcar" o código,
                // como enviar para um servidor, salvar em uma lista, etc.
                
                // Opcional: Limpar o campo após marcar
                campoCodigo.value = '';

            } else {
                alert('Por favor, digite um código no campo antes de marcar.');
                // Opcional: Focar no campo de input para o usuário digitar
                campoCodigo.focus();
            }
        });
        
  </script>
